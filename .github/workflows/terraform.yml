name: Terraform Infrastructure

on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.0"

      - name: Check Terraform formatting
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Initialize Terraform without the remote backend
        run: terraform -chdir=terraform init -backend=false

      - name: Validate Terraform
        run: terraform -chdir=terraform validate

  plan-and-apply:
    name: Plan and Apply
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.0"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Initialize Terraform
        run: terraform -chdir=terraform init

      - name: Create Terraform plan
        run: terraform -chdir=terraform plan -lock=true -out=tfplan

      - name: Apply Terraform plan
        run: terraform -chdir=terraform apply -lock=true -input=false tfplan
