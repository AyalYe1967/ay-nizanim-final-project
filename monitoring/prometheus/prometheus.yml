global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: ay-l-final-project

scrape_configs:
  # Prometheus scraping itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'web'
    metrics_path: /metrics
    static_configs:
      - targets: ['web:8000']

  # RQ worker - rq-exporter sidecar, already wired via Service Connect in ecs.tf
  - job_name: 'worker'
    static_configs:
      - targets: ['worker:8888']

  # RQ scheduler - same rq-exporter sidecar pattern as worker
  - job_name: 'scheduler'
    static_configs:
      - targets: ['scheduler:8888']

remote_write:
  - url: "AMP_REMOTE_WRITE_URL_PLACEHOLDER"
    sigv4:
      region: us-east-1
    queue_config:
      max_samples_per_send: 1000
      max_shards: 10
      min_backoff: 30ms